<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maison Roru CMS</title>
<script src="js/db.js?v=20261006976"></script>
<script src="js/auth.js?v=20261006976"></script>
<script>ICS_AUTH.guard()</script>
<script src="js/ui.js?v=20261006976"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=20261006976">
<link rel="stylesheet" href="css/cms.css?v=20261006976">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="burger" id="burger" aria-label="เปิด/ปิดเมนู" aria-controls="side">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div class="crumb"><span id="crumbIcon"></span><div><div class="eyebrow" id="pageGroup">Maison Roru</div><div class="font-semibold" id="pageTitle"></div></div></div>
    <button class="user" id="user" popovertarget="userMenu" aria-label="บัญชีผู้ใช้" aria-haspopup="menu">
      <span class="avatar" data-initial></span>
      <span class="meta"><span class="text-sm font-semibold" data-name></span><small data-role></small></span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div id="userMenu" popover role="menu">
      <div class="who"><span class="avatar lg" data-initial></span><div><div class="font-semibold" data-name></div><small>เข้าสู่ระบบอยู่</small></div></div>
      <button class="item danger" id="logout" role="menuitem" data-icon="logout">ออกจากระบบ</button>
    </div>
  </header>
  <div class="body">
    <nav class="side" id="side" aria-label="เมนูหลัก">
      <!-- เมนูสร้างจาก DB.PAGES (js/db.js) ตามสิทธิ์ใน js/cms.js -->
      <div class="grip" id="grip" title="ลากเพื่อปรับความกว้าง"></div>
    </nav>
    <div class="scrim" id="scrim"></div>
    <iframe name="main" title="เนื้อหา"></iframe>
  </div>
</div>
<script src="js/cms.js?v=20261006976"></script>
</body>
</html>
