<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Maison Roru CMS</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css?v=20261003113">
<link rel="stylesheet" href="css/cms.css?v=20261003113">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <button class="burger" id="burger" aria-label="เปิด/ปิดเมนู" aria-controls="side">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <div><div class="eyebrow">Maison Roru</div><div class="font-semibold" id="pageTitle">คำนวณวัตถุดิบ</div></div>
    <button class="user" id="user" popovertarget="userMenu" aria-label="บัญชีผู้ใช้" aria-haspopup="menu" hidden>
      <span class="avatar" data-initial></span>
      <span class="meta"><span class="text-sm font-semibold" data-name></span><small>ผู้ใช้งาน</small></span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div id="userMenu" popover role="menu">
      <div class="who"><span class="avatar lg" data-initial></span><div><div class="font-semibold" data-name></div><small>เข้าสู่ระบบอยู่</small></div></div>
      <button class="item danger" id="logout" role="menuitem">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
        ออกจากระบบ
      </button>
    </div>
  </header>
  <div class="body">
    <nav class="side" id="side">
      <a href="test.html" target="main" aria-current="page">คำนวณวัตถุดิบ</a>
      <!-- เพิ่มเมนูอื่น: <a href="xxx.html" target="main">ชื่อเมนู</a> -->
      <div class="grip" id="grip" title="ลากเพื่อปรับความกว้าง"></div>
    </nav>
    <div class="scrim" id="scrim"></div>
    <iframe name="main" src="test.html" title="เนื้อหา"></iframe>
  </div>
</div>
<script src="js/cms.js?v=20261003113"></script>
</body>
</html>
